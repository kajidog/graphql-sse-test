query GetMessages {
  messages {
    id
    user {
      id
      nickname
    }
    content
    createdAt
  }
}

mutation SendMessage($content: String!) {
  sendMessage(content: $content) {
    id
    user {
      id
      nickname
    }
    content
    createdAt
  }
}

subscription OnMessageAdded {
  messageAdded {
    id
    user {
      id
      nickname
    }
    content
    createdAt
  }
}
